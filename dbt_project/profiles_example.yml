duckdb_profile:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: /opt/airflow/dbt/duckdb/warehouse.duckdb
      threads: 4
      extensions: ["httpfs"]
      external_root: "s3://datalake"
      settings:
        s3_region: "{{ env_var('AWS_DEFAULT_REGION', 'us-east-1') }}"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
        s3_endpoint: "{{ env_var('S3_ENDPOINT_URL', 'http://minio:9000') | replace('https://', '') | replace('http://', '') }}"
        s3_url_style: path
        s3_use_ssl: false
